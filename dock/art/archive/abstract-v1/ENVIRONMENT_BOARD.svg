    <path d="M108 217l42-205h61l42 205z" fill="#D7AD79"/>
    <path d="M140 217l35-205h10l35 205" fill="none" stroke="#EBC79A" stroke-width="6" stroke-dasharray="12 14"/>
    <path d="M12 48h96M12 61h96M253 70h90M253 83h90" stroke="#8C755C" stroke-width="5"/>
    <path d="M31 33v42M83 33v42M274 55v42M322 55v42" stroke="#8C755C" stroke-width="6"/>
    <rect x="32" y="127" width="48" height="35" fill="#F0BB58" stroke="#263F52" stroke-width="4"/>
    <path d="M25 127l31-25 31 25z" fill="#EF746B" stroke="#263F52" stroke-width="4"/>
    <path d="M179 54v-26m0 0l-12 12m12-12l12 12" stroke="#263F52" stroke-width="5" fill="none"/>
