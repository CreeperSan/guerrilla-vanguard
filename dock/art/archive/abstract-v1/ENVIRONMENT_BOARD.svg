  <g transform="translate(806 132)" shape-rendering="crispEdges">
    <rect width="355" height="276" rx="14" fill="#FFFFFF" stroke="#263F52" stroke-width="3"/>
    <rect x="12" y="12" width="331" height="205" fill="#F6DEAA"/>
    <path d="M12 12h331v70H12z" fill="#77D5D2"/>
    <path d="M12 82h331v14H12z" fill="#C8F1E8"/>
