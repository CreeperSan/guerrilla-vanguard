    <rect width="355" height="276" rx="14" fill="#FFFFFF" stroke="#263F52" stroke-width="3"/>
    <rect x="12" y="12" width="331" height="205" fill="#B9B8D1"/>
    <path d="M12 55h331M12 101h331M12 147h331M12 193h331M83 12v43M180 55v46M275 101v46M116 147v46" stroke="#9293AF" stroke-width="3"/>
    <rect x="12" y="12" width="331" height="27" fill="#777B9A"/>
    <rect x="120" y="12" width="115" height="92" fill="#263F52"/>
    <rect x="136" y="26" width="83" height="78" fill="#DAD9E4"/>
    <rect x="120" y="12" width="115" height="12" fill="#F0BB58"/>
    <rect x="60" y="125" width="25" height="41" fill="#777B9A"/><rect x="270" y="128" width="25" height="38" fill="#777B9A"/>
    <path d="M177 138v-29m0 0l-12 12m12-12l12 12" stroke="#263F52" stroke-width="5" fill="none"/>
    <text x="20" y="248" font-size="19" font-weight="700" fill="#263F52" font-family="PingFang SC, sans-serif">地牢 / 门口</text>
    <text x="230" y="248" font-size="14" fill="#5D9F9D" font-family="PingFang SC, sans-serif">浅紫石砖</text>
