    <path d="M103 12h150v205H103z" fill="#819BA9"/>
    <path d="M177 33v34M177 104v34M177 176v34" stroke="#FFF8E8" stroke-width="7"/>
    <path d="M103 83h150" stroke="#E5DABB" stroke-width="4"/>
    <path d="M112 87v25m23-25v25m23-25v25m23-25v25m23-25v25m23-25v25" stroke="#FFF8E8" stroke-width="7"/>
    <path d="M177 46v-23m0 0l-12 12m12-12l12 12" stroke="#263F52" stroke-width="5" fill="none"/>
