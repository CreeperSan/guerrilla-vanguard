  <!-- Countryside -->
  <g transform="translate(806 427)" shape-rendering="crispEdges">
    <rect width="355" height="276" rx="14" fill="#FFFFFF" stroke="#263F52" stroke-width="3"/>
    <rect x="12" y="12" width="331" height="205" fill="#C9DFAC"/>
