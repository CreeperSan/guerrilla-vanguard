<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <title>岚谷前哨环境与出口风格板</title>
  <desc>六类环境各有渲染色调，出口分别以门口、路牌或马路表现。仅为风格示意。</desc>
  <rect width="1200" height="760" fill="#FFF8E8"/>
  <rect width="1200" height="12" fill="#59CFA7"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#263F52">
    <text x="42" y="66" font-size="34" font-weight="800">同一场战斗，六种环境气质</text>
    <text x="43" y="99" font-size="17">地表材质、边界与光感随地点变化；出口的形态也跟着场景变化。</text>
  </g>

  <!-- Fortress -->
  <g transform="translate(40 132)" shape-rendering="crispEdges">
    <rect width="355" height="276" rx="14" fill="#FFFFFF" stroke="#263F52" stroke-width="3"/>
    <rect x="12" y="12" width="331" height="205" fill="#B5D9DB"/>
    <path d="M12 64h331M12 116h331M12 168h331M66 12v205M120 12v205M174 12v205M228 12v205M282 12v205" stroke="#8BC8C1" stroke-width="3"/>
    <rect x="12" y="12" width="331" height="27" fill="#5D9F9D"/>
    <rect x="128" y="12" width="99" height="79" fill="#263F52"/>
    <rect x="140" y="25" width="75" height="66" fill="#F4EBCF"/>
    <rect x="128" y="12" width="99" height="12" fill="#7DAFE8"/>
    <path d="M177 128v-28m0 0l-13 13m13-13l13 13" stroke="#263F52" stroke-width="5" fill="none"/>
    <text x="20" y="248" font-size="19" font-weight="700" fill="#263F52" font-family="PingFang SC, sans-serif">要塞 / 门口</text>
    <text x="230" y="248" font-size="14" fill="#5D9F9D" font-family="PingFang SC, sans-serif">冷色金属</text>
  </g>

