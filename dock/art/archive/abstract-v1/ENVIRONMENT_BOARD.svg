    <rect x="262" y="12" width="81" height="96" fill="#8BC8C1"/>
    <rect x="27" y="30" width="22" height="26" fill="#FFF8E8"/><rect x="59" y="30" width="22" height="26" fill="#FFF8E8"/>
    <rect x="277" y="30" width="22" height="26" fill="#FFF8E8"/><rect x="307" y="30" width="22" height="26" fill="#FFF8E8"/>
