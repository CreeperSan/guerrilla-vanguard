    <rect x="12" y="12" width="331" height="205" fill="#CAE6AA"/>
    <path d="M12 173h331v44H12z" fill="#B2D68D"/>
    <path d="M138 217l24-125h78l31 125z" fill="#E8D9A6"/>
    <rect x="34" y="64" width="20" height="102" fill="#856E57"/>
    <path d="M12 82l30-65 33 65zM8 112l36-72 39 72z" fill="#65B980" stroke="#263F52" stroke-width="3"/>
    <rect x="296" y="74" width="18" height="93" fill="#856E57"/>
    <path d="M270 90l34-70 34 70zM263 120l42-73 41 73z" fill="#65B980" stroke="#263F52" stroke-width="3"/>
    <rect x="173" y="49" width="10" height="72" fill="#856E57"/>
