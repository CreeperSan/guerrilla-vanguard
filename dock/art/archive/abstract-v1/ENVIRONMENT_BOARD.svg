  <text x="42" y="740" font-size="13" fill="#5D9F9D" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">STYLE BOARD v0.2 · 六类环境示意；当前三关建议先用森林、乡村、要塞。角色、弹幕与 HUD 保持统一识别规则。</text>
