<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <title>Guerrilla Vanguard 美术风格板 v0.1</title>
  <desc>明亮像素卡通的色板、形状语法与战斗画面层级示意，不是最终资产原型图。</desc>
  <rect width="1200" height="760" fill="#FFF8E8"/>
  <rect x="0" y="0" width="1200" height="12" fill="#59CFA7"/>
  <g fill="#263F52" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="54" y="72" font-size="36" font-weight="800">岚谷前哨 · 美术风格板</text>
    <text x="55" y="106" font-size="18">明亮像素卡通  /  俯视弹幕射击  /  小尺寸优先识别</text>
  </g>

