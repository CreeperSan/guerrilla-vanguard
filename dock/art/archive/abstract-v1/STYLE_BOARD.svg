    <text x="610" y="372">描边 #263F52  ·  地板 #F4EBCF  ·  墙体 #8BC8C1</text>
  </g>

  <rect x="40" y="428" width="1120" height="266" rx="18" fill="#FFF8E8" stroke="#263F52" stroke-width="3"/>
