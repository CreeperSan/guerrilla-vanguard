; 可复制到 user://combat_balance.cfg，或通过 --combat-balance-config=绝对路径 指定。
; 倍率使用小数：1.0 = 100%，2.0 = 200%；缺省字段沿用项目 .tres。
[base]
; 保留上一轮所有敌军伤害翻倍的基础调整。
enemy_damage_multiplier=2.0

[airborne]
enemy_health_multiplier=1.0
enemy_damage_multiplier=1.0

[counterattack]
; 相对当前基础难度，生命与伤害分别再乘两倍。
enemy_health_multiplier=2.0
enemy_damage_multiplier=2.0
